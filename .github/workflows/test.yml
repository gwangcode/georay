name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy trimesh pytest
          pip install -e .

      # ---------------------------------------------------------------
      # ★ NEW: Physical validation (blocking)
      # ---------------------------------------------------------------
      - name: Run physical validation tests
        run: |
          pytest tests/test_physics.py tests/test_physics_advanced.py -v --tb=short

      # ---------------------------------------------------------------
      # Unit / integration tests (structural)
      # ---------------------------------------------------------------
      - name: Run structural tests
        run: |
          pytest tests/ -v --ignore=tests/test_physics.py \
                          --ignore=tests/test_physics_advanced.py \
                          --tb=short

      # ---------------------------------------------------------------
      # Full suite on failure (for diagnostics)
      # ---------------------------------------------------------------
      - name: Full test suite (on failure)
        if: failure()
        run: |
          pytest tests/ -v --tb=long
