[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "georay"
version = "1.2.0"
description = "A GPU-Accelerated Ray Tracer for GRIN and Polarization Optics"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Gang Wang" },
]
keywords = [
    "ray-tracing", "optics", "GRIN", "polarization",
    "fresnel", "stokes", "GPU", "pytorch", "warp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

# ---- 核心依赖（最小集） ----
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
]

# ---- 可选依赖 ----
[project.optional-dependencies]
# 网格 I/O（NPZ/STL 导出、trimesh 网格加载）
io = ["trimesh>=3.20"]

# Warp GPU 加速（全内核 tracer，推荐）
warp = ["warp-lang>=1.0"]

# STEP 网格适配（依赖 stepmesh）
step = ["trimesh>=3.20", "stepmesh"]

# 一次性装齐所有可选依赖
all = [
    "trimesh>=3.20",
    "warp-lang>=1.0",
]

# 开发工具
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "trimesh>=3.20",
]

[project.urls]
Homepage = "https://github.com/gwangcode/georay"
Repository = "https://github.com/gwangcode/georay"
Issues = "https://github.com/gwangcode/georay/issues"

# ==============================================================================
# 构建
# ==============================================================================

[tool.hatch.build.targets.wheel]
packages = ["georay"]

[tool.hatch.build.targets.sdist]
include = [
    "/georay",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

# ==============================================================================
# pytest
# ==============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "gpu: tests that require a CUDA GPU",
    "slow: tests that take more than 5 seconds",
    "warp: tests that require warp-lang",
    "io: tests that require trimesh",
]

# ==============================================================================
# ruff
# ==============================================================================

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", ".venv", "build", "dist", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "N806", "N803"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"examples/*" = ["E402", "F401"]
"georay/warp_tracer.py" = ["N803", "N806"]